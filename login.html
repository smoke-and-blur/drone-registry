<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Вхід — Реєстр пошкоджень</title>
<style>
:root{
  --floor:#0E1210; --floor2:#121714; --crate:#181E1A; --crate2:#1F2621;
  --seam:#2B342D; --seam2:#3A453C;
  --stencil:#E9ECE4; --stencil2:#B8BFB2; --faded:#828A7E;
  --khaki:#B7C77E; --khaki-ink:#151A10;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0}
body{background:var(--floor);color:var(--stencil);min-height:100vh;
  font:15px/1.45 -apple-system,'Segoe UI',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:16px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--seam) 1px,transparent 1px),
    linear-gradient(90deg,var(--seam) 1px,transparent 1px);
  background-size:44px 44px;opacity:.14}
svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
form{position:relative;z-index:1;background:var(--crate);border:1px solid var(--seam2);
  border-radius:14px;padding:22px;width:100%;max-width:340px;display:grid;gap:12px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.6px;font-size:14px}
.logo svg{width:22px;height:22px;color:var(--khaki);flex:none}
p{font-size:12.5px;color:var(--faded);line-height:1.5}
label{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;
  color:var(--faded);font-weight:700}
input{width:100%;padding:9px 11px;height:40px;font-size:15px;font-family:var(--mono);
  background:var(--floor2);color:var(--stencil);border:1px solid var(--seam);
  border-radius:11px;outline:none}
input:focus{border-color:var(--khaki);background:var(--crate2)}
button{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  height:40px;font-size:14px;font-weight:600;border-radius:10px;cursor:pointer;
  border:1px solid var(--khaki);background:var(--khaki);color:var(--khaki-ink);
  font-family:inherit}
button:hover{filter:brightness(1.06)}
.err{background:rgba(214,110,96,.14);border:1px solid #D66E60;color:#E9A79E;
  border-radius:10px;padding:8px 11px;font-size:12.5px}
</style>
</head>
<body>
<form method="post" action="/login">
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="3"/></svg>
    <span>РЕЄСТР ПОШКОДЖЕНЬ</span>
  </div>
  <p>Доступ обмежено. Введіть пароль підрозділу.</p>
  <div id="err" class="err" hidden>Невірний пароль</div>
  <div>
    <label for="p">Пароль</label>
    <input id="p" name="password" type="password" autocomplete="current-password"
           autofocus required>
  </div>
  <button type="submit">
    <svg style="width:17px;height:17px" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    Увійти
  </button>
</form>
<script>
if(/[?&]e=1/.test(location.search)){
  document.getElementById('err').hidden=false;
  history.replaceState(null,'','/login');
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Картка пошкодження БпЛА</title>
<style>
:root{
  --floor:#0E1210; --floor2:#121714;
  --crate:#181E1A; --crate2:#1F2621; --crate3:#273029;
  --seam:#2B342D; --seam2:#3A453C;
  --stencil:#E9ECE4; --stencil2:#B8BFB2; --faded:#828A7E;
  --khaki:#B7C77E; --khaki-ink:#151A10;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --gap:7px;
  --cols:4;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
body{background:var(--floor);color:var(--stencil);
  font:15px/1.45 -apple-system,'Segoe UI',system-ui,sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(var(--seam) 1px,transparent 1px),
    linear-gradient(90deg,var(--seam) 1px,transparent 1px);
  background-size:44px 44px;opacity:.14}
#root{position:relative;z-index:1}
svg{flex:none;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--khaki);outline-offset:2px}

header{position:sticky;top:0;z-index:20;background:rgba(14,18,16,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--seam)}
.hbar{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;
  align-items:center;gap:8px;min-height:56px;min-width:0}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;min-width:0;
  background:none;border:0;padding:0;cursor:pointer;font-family:inherit;
  color:inherit;text-align:left;
  letter-spacing:.6px;font-size:15px;white-space:nowrap;overflow:hidden}
.logo b{font-weight:800;overflow:hidden;text-overflow:ellipsis}
.logo svg{width:20px;height:20px;color:var(--khaki)}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:11px;border:1px solid var(--seam2);
  background:var(--crate2);display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--stencil2);flex:none}
.iconbtn:hover{color:var(--stencil)}
.iconbtn svg{width:18px;height:18px}

.wrap{max-width:1000px;margin:0 auto;padding:14px 12px 80px;display:grid;gap:18px}
#card{display:grid;gap:18px;min-width:0;cursor:default}
#cols,#tail{display:grid;gap:18px;min-width:0}
.lbl{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--faded);
  font-weight:700;height:13px;line-height:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field{display:grid;gap:3px;align-content:start;min-width:0;grid-template-rows:12px 36px}
.field.ta{grid-template-rows:13px auto}
input,textarea,select{width:100%;min-width:0;padding:8px 10px;font-size:14px;height:36px;
  background:var(--floor2);color:var(--stencil);border:1px solid var(--seam);
  border-radius:11px;outline:none;font-family:inherit;appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--khaki);background:var(--crate2)}
input::placeholder{color:#5E655B}
textarea{height:auto;min-height:64px;resize:vertical}
select{background-image:linear-gradient(45deg,transparent 50%,var(--faded) 50%),
  linear-gradient(135deg,var(--faded) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
  background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.mono{font-family:var(--mono);letter-spacing:.2px;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:9px;height:38px;font-size:13.5px;font-weight:600;border-radius:10px;
  cursor:pointer;border:1px solid var(--seam2);background:var(--crate2)}
.btn:hover{border-color:var(--faded)}
.btn.pri{background:var(--khaki);border-color:var(--khaki);color:var(--khaki-ink)}
.btn svg{width:17px;height:17px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
.acts{display:grid;gap:var(--gap)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}


.blk{background:var(--crate);border:1px solid var(--seam);border-radius:14px;
  padding:10px 11px;display:grid;gap:8px;min-width:0}
.blk>*{min-width:0}
.wrap>*{min-width:0}
.savebar{position:sticky;bottom:0;z-index:15;display:flex;align-items:center;gap:10px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(14,18,16,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--seam);margin:0 -12px -80px}
.savebar .btn{width:auto;min-width:150px;flex:none}
.savebar .btn:disabled{opacity:.6;cursor:default}
.sstate{flex:1;min-width:0;font-size:12px;color:var(--faded);line-height:1.35}
.sstate.warn{color:var(--khaki)}
.bhint{font-size:11.5px;color:var(--faded);line-height:1.4;margin:-2px 0 2px}
.blkh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:11.5px;height:18px;
  letter-spacing:1.4px;text-transform:uppercase;color:var(--stencil2);white-space:nowrap}
.blkh svg{width:15px;height:15px;color:var(--khaki)}
.blkh .n{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--faded);
  background:var(--floor2);border:1px solid var(--seam);border-radius:5px;
  padding:1px 7px;letter-spacing:0;min-width:38px;max-width:100%;text-align:center;flex:none;
  overflow:hidden;text-overflow:ellipsis}
.fields{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:var(--gap)}
.fields.c3{grid-template-columns:repeat(3,1fr)}
.field.wide{grid-column:auto}
.fields>*,.opts>*,.grid2>*,.grid4>*,.sheet>*,.phs>*{min-width:0}

.opts{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:var(--gap)}
.opts.c3{grid-template-columns:repeat(3,1fr)}
.opts.c2{grid-template-columns:repeat(2,1fr)}
.opts.c4{grid-template-columns:repeat(4,1fr)}
.full{grid-column:1/-1}
.dv{display:none}
.opt.rad .box{border-radius:99px}
.opt.rad .box i{width:8px;height:8px;border-radius:99px;background:var(--khaki-ink);
  display:block;opacity:0}
.opt.rad.on .box{background:var(--khaki);border-color:var(--khaki)}
.opt.rad.on .box i{opacity:1}
@media(max-width:720px){.opts.c3{grid-template-columns:repeat(3,1fr)}
.opts.c2{grid-template-columns:repeat(2,1fr)}
.full{grid-column:1/-1}
.dv{display:none}
.opt.rad .box{border-radius:99px}
.opt.rad .box i{width:8px;height:8px;border-radius:99px;background:var(--khaki-ink);
  display:block;opacity:0}
.opt.rad.on .box{background:var(--khaki);border-color:var(--khaki)}
.opt.rad.on .box i{opacity:1}}
.opt{display:flex;align-items:center;gap:8px;min-height:38px;padding:5px 9px;overflow:hidden;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  background:var(--floor2);border:1px solid var(--seam);border-radius:11px;
  cursor:pointer;font-size:12.5px;line-height:1.15}
.opt>span:last-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden}
.opt.on{border-color:var(--khaki);background:var(--crate3)}
.opt.pad,.field.pad{visibility:hidden}
.box{width:18px;height:18px;min-width:18px;border:1.5px solid var(--seam2);border-radius:6px;
  display:grid;place-items:center;flex:none;color:transparent;box-sizing:border-box}
.box svg{width:12px;height:12px;stroke-width:2.6}
.opt.on .box{background:var(--khaki);border-color:var(--khaki);color:var(--khaki-ink)}

.mxwrap{overflow-x:auto;min-width:0;scrollbar-gutter:stable}
.mx{display:grid;gap:var(--gap);min-width:min(540px,100%)}
.mxrow{display:grid;grid-template-columns:var(--mxc);gap:var(--gap);min-width:0}
.mxh{font-size:10px;color:var(--faded);text-align:center;line-height:1.15;
  display:flex;align-items:flex-end;justify-content:center;padding:0 2px;height:22px}
.mxl{display:flex;align-items:center;font-family:var(--mono);font-size:12.5px;font-weight:700}
.mxl.w{font-family:inherit;font-size:11.5px;font-weight:600;line-height:1.15;color:var(--stencil2)}
.mx.tr{min-width:0;gap:6px}
.mx.tr .mxrow{gap:6px}
.mx.tr .mxh{height:20px;align-items:center;font-family:var(--mono);font-size:12px;
  font-weight:700;color:var(--stencil2)}

.mx.tr .cell{max-width:38px}
.mx.tr{display:none}
@media(max-width:720px){.mx.tr{display:grid}.mx.wide{display:none}}
.cell{display:grid;place-items:center;width:100%;max-width:34px;aspect-ratio:1;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  justify-self:center;background:var(--floor2);
  border:1px solid var(--seam);border-radius:11px;cursor:pointer;color:transparent}
.cell svg{width:14px;height:14px;stroke-width:2.6}
.cell.on{border-color:var(--khaki);background:var(--khaki);color:var(--khaki-ink)}

.field.sig{display:none}
.qrbox{display:grid;place-items:center;padding:4px}
.qrbox svg{width:150px;height:150px;background:#fff;border-radius:6px}
.sigl{border-bottom:1px solid var(--seam2);height:26px}
.segx{display:flex;border:1px solid var(--seam2);border-radius:6px;overflow:hidden;
  margin-left:auto;flex:none}
.segx button{border:0;background:var(--crate2);color:var(--faded);font-family:var(--mono);
  font-size:11.5px;font-weight:700;padding:3px 10px;cursor:pointer}
.segx button.on{background:var(--khaki);color:var(--khaki-ink)}

/* фото */
.phs{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:var(--gap)}
.ph{position:relative;aspect-ratio:4/3;background:var(--floor2);
  border:1px solid var(--seam);border-radius:8px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .rm{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:6px;
  border:1px solid var(--seam2);background:rgba(14,18,16,.82);display:grid;place-items:center;
  cursor:pointer;color:var(--stencil2)}
.ph .rm svg{width:14px;height:14px}
.ph .ix{position:absolute;left:6px;bottom:6px;font-family:var(--mono);font-size:10px;
  background:rgba(14,18,16,.82);border-radius:4px;padding:1px 6px}
.phadd{display:grid;place-items:center;gap:6px;aspect-ratio:4/3;cursor:pointer;
  border:1px dashed var(--seam2);border-radius:8px;background:var(--floor2);
  color:var(--faded);font-size:13px}
.phadd svg{width:20px;height:20px}

/* стікер */
.sheet{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap)}
.sheet>*:nth-child(n+2){display:none}
.stick{background:var(--floor2);border:1px solid var(--seam2);border-radius:8px;
  padding:10px;display:grid;gap:8px;align-content:start;align-self:start}
/* Позначки на стікері. Кожна має власне місце, бо можуть стояти
   всі три водночас. Форми різні — стікер друкується чорно-білим. */
.stick{position:relative}
.s-mk{position:absolute;display:block;pointer-events:none}
/* ▲ трикутник — є підстава */
.mk-tri{top:7px;right:7px;width:0;height:0;
  border-left:9px solid transparent;border-right:9px solid transparent;
  border-bottom:16px solid var(--stencil)}
/* ■ квадрат — незалежна діагностика */
.mk-sq{top:30px;right:7px;width:16px;height:16px;background:var(--stencil)}
/* ● коло — підлягає ремонту */
.mk-cir{top:52px;right:8px;width:16px;height:16px;border-radius:50%;
  background:var(--stencil)}
/* ✕ хрест — не підлягає ремонту */
.mk-x{top:74px;right:7px;width:17px;height:17px}
.mk-x::before,.mk-x::after{content:'';position:absolute;top:7px;left:0;
  width:17px;height:3px;background:var(--stencil)}
.mk-x::before{transform:rotate(45deg)}
.mk-x::after{transform:rotate(-45deg)}
.mklegend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--faded);
  padding-top:2px}
.mklegend span{display:flex;align-items:center;gap:5px}
.mklegend i{flex:none}
.lg-tri{width:0;height:0;border-left:6px solid transparent;
  border-right:6px solid transparent;border-bottom:10px solid var(--stencil2)}
.lg-cir{width:11px;height:11px;border-radius:50%;background:var(--stencil2)}
.lg-sq{width:10px;height:10px;background:var(--stencil2)}
/* Значок форми поруч із підписом поля — щоб було видно, що саме
   зʼявиться на стікері. */
.inl{display:inline-block;vertical-align:middle;margin-left:5px;opacity:.85}
.opt .inl{margin-left:6px}
.lg-x{position:relative;width:11px;height:11px}
.lg-x::before,.lg-x::after{content:'';position:absolute;top:4px;left:0;
  width:11px;height:2px;background:var(--stencil2)}
.lg-x::before{transform:rotate(45deg)}
.lg-x::after{transform:rotate(-45deg)}
.s-hd{display:grid;gap:3px}
.s-unit{display:flex;align-items:baseline;gap:8px;font-size:21px;font-weight:800;
  line-height:1.1;overflow:hidden}
.s-unit .st{margin-left:auto;font-size:12px;font-weight:800;letter-spacing:.5px;
  color:var(--stencil2);white-space:nowrap}
.s-unit .st.ok{color:var(--khaki)}
.s-name{font-size:19px;font-weight:700;line-height:1.15;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.s-name .cs{color:var(--faded);font-weight:600}
.s-mdl{font-size:16px;font-weight:700;color:var(--stencil2);line-height:1.15}
.s-sn{font-family:var(--mono);font-size:19px;font-weight:800;line-height:1.15;
  letter-spacing:.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-meta{display:grid;grid-template-columns:1fr auto;gap:8px;font-family:var(--mono);
  font-size:12px;color:var(--faded)}
.s-meta .r{text-align:right}
.s-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.s-list{display:none;flex-wrap:wrap;gap:6px}
.s-i{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--seam);
  border-radius:5px;padding:3px 7px;font-size:13px;font-weight:600}
.s-i .box{width:14px;height:14px;min-width:14px;border-radius:4px}
.s-i.on .box{background:var(--khaki);border-color:var(--khaki);color:var(--khaki-ink)}
.s-c{display:flex;align-items:center;gap:6px;height:30px;padding:0 7px;font-size:13px;
  line-height:1;font-weight:600;
  border:1px solid var(--seam);border-radius:5px;background:var(--crate)}
.s-c .box{width:14px;height:14px;min-width:14px;border-radius:4px}
.s-c .box svg{width:9px;height:9px}
.s-c.on{border-color:var(--khaki)}
.s-c.on .box{background:var(--khaki);border-color:var(--khaki);color:var(--khaki-ink)}
.s-ft{display:none}

/* сканер */
.torch{position:absolute;right:10px;bottom:10px;width:42px;height:42px;
  border-radius:12px;border:1px solid var(--seam2);background:rgba(14,18,16,.78);
  color:var(--stencil2);display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;z-index:3;backdrop-filter:blur(4px)}
.torch svg{width:20px;height:20px}
.torch.on{background:var(--khaki);border-color:var(--khaki);color:var(--khaki-ink)}
.torch.on svg{fill:currentColor}
.diagbtn{font-size:12px;color:var(--faded);height:32px}
.loadrow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--faded);
  padding:6px 2px}
.spin{width:15px;height:15px;flex:none;border-radius:50%;
  border:2px solid var(--seam2);border-top-color:var(--khaki);
  animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
.campick{display:flex;flex-wrap:wrap;gap:var(--gap)}
.campick .opt{flex:1 1 auto;min-width:0;justify-content:center;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-size:12.5px;
  border:1px solid var(--seam2);background:var(--crate2);color:var(--stencil2);
  border-radius:9px;padding:7px 10px;display:flex;align-items:center;font-family:inherit}
.campick .opt.on{border-color:var(--khaki);color:var(--khaki);background:rgba(183,199,126,.12)}
.zoomrow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.zoomrow input[type=range]{width:100%;accent-color:var(--khaki);height:28px;
  background:transparent;border:0;padding:0}
.cam{position:relative;background:var(--floor2);border:1px solid var(--seam);
  border-radius:14px;overflow:hidden;aspect-ratio:4/3;width:100%;max-width:100%}
#scanBlk{max-width:520px;margin:0 auto;width:100%}
.snrow{display:grid;grid-template-columns:1fr;gap:var(--gap)}
.scan3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
.scan3 .btn{padding:0 8px}
@media(max-width:720px){.scan3{grid-template-columns:1fr}}
.snrow input{height:44px;font-size:15px;letter-spacing:.6px}
.cam video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.frame{position:absolute;inset:16%;border:2px solid var(--khaki);border-radius:12px;
  box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
.camoff{position:absolute;inset:0;display:grid;place-items:center;color:var(--faded);
  font-size:13px;text-align:center;padding:20px}

.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);
  display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--crate);border:1px solid var(--seam2);border-radius:12px;
  width:100%;max-width:420px;padding:16px;display:grid;gap:var(--gap)}
.dlg h3{font-size:15px;display:flex;align-items:center;gap:8px}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:var(--gap)}
.ph-grid:empty{display:none}
.ph{position:relative;margin:0;aspect-ratio:1;border-radius:10px;overflow:hidden;
  border:1px solid var(--seam);background:var(--floor2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph-x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:7px;
  border:1px solid var(--seam2);background:rgba(14,18,16,.82);color:var(--stencil2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ph-x:hover{color:#E9A79E;border-color:#D66E60}
.ph-x svg{width:13px;height:13px}
.phblk .btn[disabled]{opacity:.5;cursor:not-allowed}
.ph-lim{font-size:12px;color:var(--faded);line-height:1.45;padding:2px 1px}
.shotdlg{max-width:520px}
.shotbox{position:relative;background:#000;border:1px solid var(--seam);
  border-radius:11px;overflow:hidden;aspect-ratio:4/3;display:grid;place-items:center}
.shotbox video{width:100%;height:100%;object-fit:cover;display:block}
.shoterr{position:absolute;inset:0;display:grid;place-items:center;padding:16px;
  text-align:center;font-size:12.5px;color:var(--stencil2);background:var(--floor2)}
.ph-ov{cursor:zoom-out}
.ph-ov img{max-width:96vw;max-height:92vh;border-radius:10px;
  border:1px solid var(--seam2);object-fit:contain}
.cdlg{max-width:560px}
.cdlg h3 svg{color:var(--khaki)}
.cnote{font-size:12.5px;color:var(--stencil2);line-height:1.5}
.ctbl{max-height:46vh;overflow:auto;border:1px solid var(--seam);border-radius:10px}
.ctbl table{width:100%;border-collapse:collapse;font-size:13px}
.ctbl th{position:sticky;top:0;background:var(--crate2);text-align:left;
  padding:7px 9px;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;
  color:var(--faded);font-weight:700;border-bottom:1px solid var(--seam)}
.ctbl td{padding:7px 9px;border-bottom:1px solid var(--seam);vertical-align:top;
  word-break:break-word}
.ctbl tr:last-child td{border-bottom:0}
.ctbl .ck{color:var(--faded);font-size:11.5px;white-space:nowrap}
.ctbl .cv{width:38%}
.ctbl .src{display:none}
@media(max-width:560px){
  /* Шапка: логотип із довгою назвою виштовхував п'ять кнопок за екран. */
  .hbar{padding:8px 10px;gap:4px;min-height:52px}

<script>
/* ── QR: byte mode, рівень M, версії 1..40 ── */
var QR=(function(){
  var EXP=[],LOG=[];
  (function(){ var x=1; for(var i=0;i<255;i++){ EXP[i]=x; LOG[x]=i; x=x<<1; if(x&256) x^=285; } })();
  function mul(a,b){ return (a&&b)?EXP[(LOG[a]+LOG[b])%255]:0; }
  var ECC=[0,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28];
  var BLK=[0,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49];
  function rawModules(v){
    var r=(16*v+128)*v+64;
    if(v>=2){ var n=Math.floor(v/7)+2; r-=(25*n-10)*n-55; if(v>=7) r-=36; }
    return r;
  }
  function dataCw(v){ return Math.floor(rawModules(v)/8)-ECC[v]*BLK[v]; }
  function alignPos(v){
    if(v===1) return [];
    var n=Math.floor(v/7)+2, size=v*4+17,
        step=(v===32)?26:Math.ceil((v*4+4)/(n*2-2))*2, r=[6];
    for(var pos=size-7;r.length<n;pos-=step) r.splice(1,0,pos);
    return r;
  }
  function genPoly(d){
    var r=[1];
    for(var i=0;i<d;i++){
      r.push(0);
      for(var j=r.length-1;j>0;j--) r[j]=r[j-1]^mul(r[j],EXP[i]);
      r[0]=mul(r[0],EXP[i]);
    }
    return r;
  }
  function rs(data,d){
    var g=genPoly(d).slice(0,d).reverse(),res=new Array(d).fill(0);
    for(var i=0;i<data.length;i++){
      var f=data[i]^res[0];
      res.shift(); res.push(0);
      for(var j=0;j<d;j++) res[j]^=mul(g[j],f);
    }
    return res;
  }
  function utf8(str){
    var e=unescape(encodeURIComponent(str)),b=[];
    for(var i=0;i<e.length;i++) b.push(e.charCodeAt(i));
    return b;
  }
  function fmtBits(data){
    var rem=data;
    for(var i=0;i<10;i++) rem=((rem<<1)^(((rem>>>9)&1)*0x537))&0x7FF;
    return ((data<<10)|(rem&0x3FF))^0x5412;
  }
  function verBits(v){
    var rem=v;
    for(var i=0;i<12;i++) rem=((rem<<1)^(((rem>>>11)&1)*0x1F25))&0x1FFF;
    return (v<<12)|(rem&0xFFF);
  }
  function build(text){
    var bytes=utf8(text),v,cap;
    for(v=1;v<=40;v++){
      var cc=(v<10)?8:16;
      cap=dataCw(v)*8;
      if(4+cc+bytes.length*8<=cap) break;
    }
    if(v>40) return null;
    var cc=(v<10)?8:16,bits=[];

           на пів модуля ламає гомографію. */
        var ccx=x+(R[0]-L[0])/2,ccy=y+(D[0]-U[0])/2;
        var dist=(ccx-ex)*(ccx-ex)+(ccy-ey)*(ccy-ey);
        hits.push({x:ccx,y:ccy,d:dist});
      }
    }
    /* Кластеризуємо сусідні пікселі одного патерна і повертаємо
       кілька найближчих кандидатів — правильний вибере той, хто
       зможе прочитати код. */
    var cl=[];
    hits.sort(function(p,q){ return p.d-q.d; });
    for(var i=0;i<hits.length;i++){
      var p2=hits[i],near=false;
      for(var j=0;j<cl.length;j++)
        if(Math.abs(cl[j].x-p2.x)<mu&&Math.abs(cl[j].y-p2.y)<mu){ near=true; break; }
      if(!near) cl.push(p2);
      if(cl.length>=6) break;
    }
    return cl;
  }

  /* Семплінг за гомографією (H відображає модульні координати в пікселі). */
  function sampleH(b,H,size){
    var m=[],bits=b.bits,w=b.w,h=b.h,r,c;
    for(r=0;r<size;r++){
      m[r]=[];
      for(c=0;c<size;c++){
        var pt=applyH(H,c+0.5,r+0.5);
        var x=Math.round(pt[0]),y=Math.round(pt[1]);
        if(x<0||y<0||x>=w||y>=h){ m[r][c]=0; continue; }
        var on=0,tot=0,dx,dy;
        for(dy=-1;dy<=1;dy++) for(dx=-1;dx<=1;dx++){
          var xx=x+dx,yy=y+dy;
          if(xx>=0&&yy>=0&&xx<w&&yy<h){ on+=bits[yy*w+xx]; tot++; }
        }
        m[r][c]=(on*2>tot)?1:0;
      }
    }
    return m;
  }

  /* Афінний варіант — коли вирівнювального патерна немає (версія 1). */
  function sample(b,o,size){
    var n=size-7;
    var H=homography(
      [[3.5,3.5],[size-3.5,3.5],[3.5,size-3.5],[size-3.5,size-3.5]],
      [[o.a.x,o.a.y],[o.b.x,o.b.y],[o.c.x,o.c.y],
       [o.b.x+o.c.x-o.a.x,o.b.y+o.c.y-o.a.y]]);
    if(!H) return null;
    return sampleH(b,H,size);
  }

  function readFormat(m,size){
    function at(list){ var v=0; for(var i=0;i<list.length;i++) v=(v<<1)|m[list[i][0]][list[i][1]]; return v; }
    var l1=[[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
    var l2=[],i;
    for(i=0;i<7;i++) l2.push([size-1-i,8]);
    for(i=7;i>=0;i--) l2.push([8,size-1-i]);
    var cand=[at(l1),at(l2)],best=null,bd=99;
    for(var ci=0;ci<cand.length;ci++){
      var v=cand[ci]^0x5412;
      for(var t=0;t<32;t++){
        var r=t<<10;
        for(var k=4;k>=0;k--) if(r&(1<<(k+10))) r^=0x537<<k;
        var full=(t<<10)|(r&0x3ff),x=full^v,dist=0;
        while(x){ dist+=x&1; x>>>=1; }
        if(dist<bd){ bd=dist; best=t; }
      }
    }
    if(best===null||bd>3) return null;
    return {ec:(best>>3)&3,mask:best&7};
  }

  function isFunc(r,c,size,ver){
    if(r<9&&c<9) return true;
    if(r<9&&c>=size-8) return true;
    if(r>=size-8&&c<9) return true;
    if(r===6||c===6) return true;
    if(ver>=7&&((r<6&&c>=size-11)||(c<6&&r>=size-11))) return true;
    var ap=alignPos(ver),i,j;
    for(i=0;i<ap.length;i++) for(j=0;j<ap.length;j++){
      if((i===0&&j===0)||(i===0&&j===ap.length-1)||(i===ap.length-1&&j===0)) continue;
      if(Math.abs(r-ap[i])<=2&&Math.abs(c-ap[j])<=2) return true;
    }
    return false;
  }

  function unmask(m,size,ver,mask){
    var out=[],r,c;
    for(r=0;r<size;r++) out[r]=m[r].slice();
    for(r=0;r<size;r++) for(c=0;c<size;c++){
      if(isFunc(r,c,size,ver)) continue;
      var inv2;
      switch(mask){
        case 0: inv2=(r+c)%2===0; break;
        case 1: inv2=r%2===0; break;
        case 2: inv2=c%3===0; break;
        case 3: inv2=(r+c)%3===0; break;
        case 4: inv2=(Math.floor(r/2)+Math.floor(c/3))%2===0; break;
        case 5: inv2=((r*c)%2)+((r*c)%3)===0; break;
        case 6: inv2=(((r*c)%2)+((r*c)%3))%2===0; break;
        default: inv2=(((r+c)%2)+((r*c)%3))%2===0;
      }
      if(inv2) out[r][c]^=1;
    }
    return out;
  }

  function readCw(m,size,ver){
    var out=[],cur=0,n=0,up=true,col,i,k;
    for(col=size-1;col>0;col-=2){
      if(col===6) col--;
      for(i=0;i<size;i++){
        var r=up?size-1-i:i;
        for(k=0;k<2;k++){
          var c=col-k;
          if(isFunc(r,c,size,ver)) continue;
          cur=(cur<<1)|m[r][c]; n++;
          if(n===8){ out.push(cur); cur=0; n=0; }
        }
      }
      up=!up;
    }
    return out;
  }

  function deinterleave(cw,ver){
    var nb=BLK[ver],ecc=ECC[ver],dataTotal=dataCw(ver),
        short=Math.floor(dataTotal/nb),extra=dataTotal%nb,sizes=[],i,b,c;
    for(i=0;i<nb;i++) sizes.push(short+(i>=nb-extra?1:0));
    var blocks=[],ecs=[];
    for(i=0;i<nb;i++){ blocks.push([]); ecs.push([]); }
    var idx=0,maxLen=short+(extra?1:0);
    for(c=0;c<maxLen;c++) for(b=0;b<nb;b++)
      if(c<sizes[b]){ if(idx>=cw.length) return null; blocks[b].push(cw[idx++]); }
    for(c=0;c<ecc;c++) for(b=0;b<nb;b++){
      if(idx>=cw.length) return null; ecs[b].push(cw[idx++]);
    }
    var data=[];
    for(b=0;b<nb;b++){
      var fixed=rsFix(blocks[b].concat(ecs[b]),ecc);
      if(!fixed) return null;
      data=data.concat(fixed.slice(0,sizes[b]));
    }
    return data;
  }

  function pad0(v,n){ var s=String(v); while(s.length<n) s='0'+s; return s; }

  function decodeBits(data,ver){
    var pos=0;
    function read(n){
      var v=0;
      for(var i=0;i<n;i++){
        var bi=pos>>3,bit=7-(pos&7);
        if(bi>=data.length) throw 0;
        v=(v<<1)|((data[bi]>>bit)&1); pos++;
      }
      return v;
    }
    var ALNUM='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:',out='';
    try{
      while(pos+4<=data.length*8){
        var mode=read(4);
        if(mode===0) break;
        if(mode===7){ read(8); continue; }
        var cb;
        if(mode===1) cb=ver<10?10:(ver<27?12:14);
        else if(mode===2) cb=ver<10?9:(ver<27?11:13);
        else if(mode===4) cb=ver<10?8:16;
        else break;
        var cnt=read(cb),i;
        if(mode===1){
          for(i=0;i<cnt;){
            var rem=cnt-i;
            if(rem>=3){ out+=pad0(read(10),3); i+=3; }
            else if(rem===2){ out+=pad0(read(7),2); i+=2; }
            else { out+=String(read(4)); i+=1; }
          }
        } else if(mode===2){
          for(i=0;i<cnt;){
            if(cnt-i>=2){ var p=read(11); out+=ALNUM.charAt(Math.floor(p/45))+ALNUM.charAt(p%45); i+=2; }
            else { out+=ALNUM.charAt(read(6)); i+=1; }
          }
        } else {
          var bytes=[];
          for(i=0;i<cnt;i++) bytes.push(read(8));
          out+=new TextDecoder('utf-8').decode(new Uint8Array(bytes));
        }
      }
    }catch(e){ return out||null; }
    return out||null;
  }

  /* Спроба прочитати вже відсемпльовану матрицю. */
  function readMatrix(m,size,ver){
    if(!m) return null;
    var fmt=readFormat(m,size);
    if(!fmt) return null;
    var cw=readCw(unmask(m,size,ver,fmt.mask),size,ver);
    if(cw.length<dataCw(ver)) return null;
    var data=deinterleave(cw,ver);
    if(!data) return null;
    return decodeBits(data,ver);
  }
  /* Читання за афінною сіткою. */
  function readGrid(b,o,size,ver){
    return readMatrix(sample(b,o,size),size,ver);
  }

  /* Спроба зчитати код за конкретною трійкою патернів. */
  function tryTriple(b,tri){
    var o=orient(tri),
        dx=o.b.x-o.a.x,dy=o.b.y-o.a.y,
        ex=o.c.x-o.a.x,ey=o.c.y-o.a.y,
        d1=Math.sqrt(dx*dx+dy*dy),d2=Math.sqrt(ex*ex+ey*ey),
        mu=(o.a.mu+o.b.mu+o.c.mu)/3;
    if(!mu||!d1||!d2) return null;
    /* сторони мають бути приблизно рівні (квадрат) */
    if(Math.abs(d1-d2)>Math.max(d1,d2)*0.25) return null;
    /* і майже перпендикулярні */
    var cosang=(dx*ex+dy*ey)/(d1*d2);
    if(Math.abs(cosang)>0.3) return null;
    var size=Math.round(((d1+d2)/2/mu+7-17)/4)*4+17;
    if(size<21||size>177) return null;
    var ver=(size-17)/4;
    QR.lastMu=mu;                  /* для діагностики: пікселів на модуль */

    /* Спершу — з 4-м орієнтиром (вирівнювальний патерн). Саме він
       дає правильну геометрію, коли кадр знято під кутом. */
    var corners=[[3.5,3.5],[size-3.5,3.5],[3.5,size-3.5]];
    if(ver>=2){
      var ap=alignPos(ver),am=ap[ap.length-1]+0.5;   /* центр нижнього-правого */
      /* очікувана позиція за паралелограмом */
      var gx=o.b.x+o.c.x-o.a.x,gy=o.b.y+o.c.y-o.a.y;
      /* трохи ближче до центру: патерн стоїть на 3 модулі всередину */
      var back=(size-3.5-am)/(size-7);
      gx-=(dx+ex)*back; gy-=(dy+ey)*back;
      var cands=findAlign(b,gx,gy,mu);
      for(var ci=0;ci<cands.length;ci++){
        var al=cands[ci];
        var H=homography(corners.concat([[am,am]]),
          [[o.a.x,o.a.y],[o.b.x,o.b.y],[o.c.x,o.c.y],[al.x,al.y]]);
        if(!H) continue;
        var r1=readMatrix(sampleH(b,H,size),size,ver);
        if(r1) return r1;
      }
    }
    /* Без орієнтира — звичайна (афінна) сітка. */
    var r=readGrid(b,o,size,ver);
    if(r) return r;
    /* Дрібні зсуви — рятують за розмиття. */
    var step=mu*0.25,d;
    for(d=0;d<8;d++){
      var ang=d*Math.PI/4,
          sx=Math.cos(ang)*step,sy=Math.sin(ang)*step;
      var o2={a:{x:o.a.x+sx,y:o.a.y+sy,mu:o.a.mu},
              b:{x:o.b.x+sx,y:o.b.y+sy,mu:o.b.mu},
              c:{x:o.c.x+sx,y:o.c.y+sy,mu:o.c.mu}};
      r=readGrid(b,o2,size,ver);
      if(r) return r;
    }
    return null;
  }

  function decode(img){
    var b=binarize(img),f=findFinders(b);
    if(f.length<3) return null;
    /* надійніші кандидати — ті, що знайдені кількома рядками */
    f.sort(function(p,q){ return q.n-p.n; });
    if(f.length>12) f=f.slice(0,12);
    var i,j,k,r;
    for(i=0;i<f.length-2;i++) for(j=i+1;j<f.length-1;j++) for(k=j+1;k<f.length;k++){
      /* модуль має бути схожого розміру в усіх трьох */
      var mx=Math.max(f[i].mu,f[j].mu,f[k].mu),
          mn=Math.min(f[i].mu,f[j].mu,f[k].mu);
      if(mx>mn*1.7) continue;
      r=tryTriple(b,[f[i],f[j],f[k]]);
      if(r) return r;
    }
    return null;
  }

  return {svg:svg,decode:decode};

function bind(){
  TEXTF.forEach(function(k){ var e=$('#f-'+k); if(e) e.oninput=function(){
    S[k]=e.value; save(); if(TECHF.indexOf(k)>=0) saveTech();
    refreshStick(); refreshQR(); }; });
  $('#f-model').onchange=function(){ S.model=this.value; save(); render(); };
  var c=$('#card');
  function act(e){
    var t=e.target.closest('[data-k],[data-st],[data-pk],[data-pm],[data-ns]');
    if(!t) return;
    if(t.dataset.k!==undefined){ flip(t); return; }
    if(t.dataset.st!==undefined){
      S.status=(S.status===t.dataset.st)?'':t.dataset.st; save();
      [].forEach.call(t.parentNode.children,function(x){
        var on=(x.dataset.st===S.status)&&!!S.status;
        x.classList.toggle('on',on); x.setAttribute('aria-checked',on); });
      refreshStick(); refreshQR(); return;
    }
    if(t.dataset.pk!==undefined){
      S[t.dataset.pk]=S[t.dataset.pk]?0:1;
      t.classList.toggle('on',!!S[t.dataset.pk]);
      t.setAttribute('aria-checked',!!S[t.dataset.pk]);
      if(t.dataset.pk==='kStick') render();   /* показати/сховати вибір кількості */
      return;
    }
    if(t.dataset.ns!==undefined){
      S.nStick=+t.dataset.ns;
      [].forEach.call(t.parentNode.children,function(x){
        x.classList.toggle('on',x===t); x.setAttribute('aria-checked',x===t); });
      refreshStick(); return;
    }
    if(t.dataset.pm!==undefined){
      S.pm=t.dataset.pm;
      [].forEach.call(t.parentNode.children,function(x){
        x.classList.toggle('on',x===t); x.setAttribute('aria-checked',x===t); });
    }
  }
  /* Делеговані обробники вішаємо ОДИН раз на весь час життя сторінки:
     #card не перестворюється, тож повторний addEventListener лише
     дублював би реакцію на клік. */
  if(!c.dataset.bound){
    c.dataset.bound='1';
    c.addEventListener('click',act);
    c.addEventListener('keydown',function(e){
      var t=e.target.closest('[data-k],[data-st],[data-pk],[data-pm],[data-ns]');
      if(t&&(e.key===' '||e.key==='Enter')){ e.preventDefault(); act({target:e.target}); } });
  }
  var pb=$('#bPhoto');
  if(pb) pb.onclick=function(){ $('#photoIn').click(); };
  var pc=$('#bPhotoCam');
  if(pc) pc.onclick=function(){
    /* На телефоні capture відкриває камеру одразу; на десктопі його
       ігнорують, тому там знімаємо через getUserMedia. */
    if(isMobile()) $('#photoCam').click(); else shootDlg();
  };
  [].forEach.call(document.querySelectorAll('#card [data-pdel]'),function(b){
    b.onclick=function(e){ e.stopPropagation(); delPhoto(+b.getAttribute('data-pdel')); };
  });
  [].forEach.call(document.querySelectorAll('#card img[data-pi]'),function(im){
    im.onclick=function(){ viewPhoto(+im.getAttribute('data-pi')); };
  });
  $('#bPrint2').onclick=printNow;
  $('#bCfg').onclick=function(){ dl(cfgBlob(),fname()+'.json'); };
  $('#bShare2').onclick=shareDlg;
  $('#bClear').onclick=function(){ S.chk={}; S.note=''; save(); render(); };
}
function flip(t){
  var k=t.dataset.k; S.chk[k]=!S.chk[k];
  [].forEach.call(document.querySelectorAll('[data-k="'+k+'"]'),function(e){
    e.classList.toggle('on',!!S.chk[k]); e.setAttribute('aria-checked',!!S.chk[k]); });
  var n=t.closest('.blk').querySelector('.blkh .n');
  if(n) n.textContent=(k.indexOf('arm.')===0)?(armCnt(1)+armCnt(2)+armCnt(3)+armCnt(4)):cnt(k.split('.')[0]);
  var bl=t.closest('.blk');
  if(bl&&bl.classList.contains('chkblk')){
    var pfx=k.indexOf('arm.')===0?'arm':k.split('.')[0];
    bl.classList.toggle('has',pfx==='arm'?!!(armCnt(1)+armCnt(2)+armCnt(3)+armCnt(4)):!!cnt(pfx));
  }
  save(); refreshDone(); refreshStick(); refreshQR();
}

/* ── конфіг: URL, файл, друк ─────────────────────────────────── */
/* QR на стікері несе лише S/N: дані все одно лежать на сервері, а
   accept() відкриє картку за номером. Це дає 25 модулів замість 49,
   тобто кожен модуль удвічі більший на тому ж стікері — і дрібний,
   і потертий код читається значно надійніше.
   Без сервера (файл на диску) кладемо всю картку, як раніше. */
function payload(){
  if(/^https?:$/.test(location.protocol)) return S.sn||link();
  var o={};
  TEXTF.concat(['model']).forEach(function(k){ if(S[k]) o[k]=S[k]; });
  o.c=[]; for(var k in S.chk){ if(S.chk[k]) o.c.push(k); }
  return JSON.stringify(o);
}
function refreshQR(){
  var b=$('#qrbox'); if(b) b.innerHTML=QR.svg(payload(),150);
}
function pack(){
  var p=new URLSearchParams();
  TEXTF.concat(['model']).forEach(function(k){ if(S[k]) p.set(k,S[k]); });
  var on=[]; for(var k in S.chk){ if(S.chk[k]) on.push(k); }
  if(on.length) p.set('c',on.join(','));
  return p.toString();
}
function unpack(q){
  var p=new URLSearchParams(q);
  TEXTF.concat(['model']).forEach(function(k){ if(p.get(k)!=null) S[k]=p.get(k); });
  S.chk={};
  (p.get('c')||'').split(',').forEach(function(k){ if(k) S.chk[k]=true; });
}
function link(){ return location.origin+location.pathname+'#'+pack(); }
var TECHF=['doneBy','techPhone'];
function saveTech(){
  var o={}; TECHF.forEach(function(k){ o[k]=S[k]; });
  try{ localStorage.setItem('dc:tech',JSON.stringify(o)); }catch(e){}
}
function loadTech(){
  try{ var o=JSON.parse(localStorage.getItem('dc:tech')||'{}');
    TECHF.forEach(function(k){ if(!S[k]&&o[k]) S[k]=o[k]; });

}
/* Локальний запис: заголовок, адреса, чернетка на пристрої.
   На сервер нічого не йде — для цього є кнопка «Зберегти». */
function save(){
  document.title=fname();
  try{ history.replaceState(null,'','#'+pack()); }catch(e){}
  if(S.sn) keepDraft();
  markUnsaved();
}
function markUnsaved(){
  if(!S.sn||loading) return;   /* під час завантаження картки зміни не наші */
  unsaved=true; refreshSaveBtn();
}
function keepDraft(){
  try{ localStorage.setItem('dc:'+S.sn,pack()); }catch(e){}
  /* Фото зберігаємо окремо: у pack() їх немає, а втрачати знімки
     при перезавантаженні не можна. Якщо місця бракує — не валимось. */
  try{
    if(S.photos&&S.photos.length)
      localStorage.setItem('dcph:'+S.sn,JSON.stringify(S.photos));
    else
      localStorage.removeItem('dcph:'+S.sn);
  }catch(e){
    toast('Фото не вмістились у памʼять пристрою — збережіть картку');
  }
}
function draftPhotos(sn){
  try{ return JSON.parse(localStorage.getItem('dcph:'+sn)||'[]'); }
  catch(e){ return []; }
}

/* Зйомка з вебкамери (десктоп). Окремий потік, щоб не чіпати сканер. */
var shotStream=null;
function shootDlg(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    toast('Камера недоступна — оберіть файл'); return;
  }
  var ov=document.createElement('div'); ov.className='ov noprint';
  ov.innerHTML='<div class="dlg shotdlg"><h3><svg style="width:17px;height:17px">'+
    '<use href="#i-cam"/></svg>Зняти фото'+
    '<button class="iconbtn" data-a="x" type="button"><svg><use href="#i-x"/></svg></button></h3>'+
    '<div class="shotbox"><video id="shotVid" playsinline muted></video>'+
    '<div class="shoterr" id="shotErr" hidden></div></div>'+
    '<button class="btn pri" data-a="snap" type="button">'+
    '<svg><use href="#i-cam"/></svg>Зняти</button></div>';
  document.body.appendChild(ov);

  var vid=ov.querySelector('#shotVid');
  function close(){
    if(shotStream){ shotStream.getTracks().forEach(function(t){ t.stop(); }); shotStream=null; }
    if(ov.parentNode) document.body.removeChild(ov);
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},
    width:{ideal:1920},height:{ideal:1080}}})
    .then(function(st){ shotStream=st; vid.srcObject=st; return vid.play(); })
    .catch(function(){
      var e=ov.querySelector('#shotErr');
      e.hidden=false; e.textContent='Немає доступу до камери. Потрібен https або localhost.';
    });

  ov.onclick=function(e){
    var a=e.target.closest('[data-a]');
    if(!a){ if(e.target===ov) close(); return; }
    if(a.getAttribute('data-a')==='x'){ close(); return; }
    if(!shotStream||!vid.videoWidth){ toast('Камера ще не готова'); return; }
    var w=vid.videoWidth,hh=vid.videoHeight,k=Math.min(1,MAXPX/Math.max(w,hh)),
        cv=document.createElement('canvas');
    cv.width=Math.round(w*k); cv.height=Math.round(hh*k);
    cv.getContext('2d').drawImage(vid,0,0,cv.width,cv.height);
    var d=cv.toDataURL('image/jpeg',JPEGQ);
    S.photos=S.photos||[];
    if(S.photos.length>=MAXPH){ toast('Максимум '+MAXPH+' фото'); close(); return; }
    S.photos.push({id:String(Date.now())+Math.random().toString(36).slice(2,7),
                   data:d,note:'',at:new Date().toISOString()});
    close(); afterPhotos();
  };
}

/* Стиснення в браузері: довга сторона <= MAXPX, JPEG. */
function shrink(file,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      var w=im.width,hh=im.height,k=Math.min(1,MAXPX/Math.max(w,hh));
      var cv=document.createElement('canvas');
      cv.width=Math.round(w*k); cv.height=Math.round(hh*k);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      cb(cv.toDataURL('image/jpeg',JPEGQ));
    };
    im.onerror=function(){ cb(null); };
    im.src=fr.result;
  };
  fr.onerror=function(){ cb(null); };
  fr.readAsDataURL(file);
}

function addPhotos(files){
  var left=MAXPH-(S.photos||[]).length;
  if(left<=0){ toast('Максимум '+MAXPH+' фото'); return; }
  var list=[].slice.call(files,0,left),pend=list.length;
  if(!pend) return;
  list.forEach(function(f){
    if(!/^image\//.test(f.type)){ if(!--pend) afterPhotos(); return; }
    shrink(f,function(d){
      if(d){
        S.photos=S.photos||[];
        S.photos.push({id:String(Date.now())+Math.random().toString(36).slice(2,7),
                       data:d,note:'',at:new Date().toISOString()});
      } else toast('Не вдалося прочитати фото');
      if(!--pend) afterPhotos();
    });
  });
}

}

}

/* ── синхронізація з сервером ────────────────────────────────── */
/* Запис на сервер увімкнено лише після того, як для цього S/N
   вирішено конфлікт (або його не було). Доки dirty=false —
   локальні зміни на сервер не йдуть і нічого там не перетирають. */
var syncT=0,dirty=false,unsaved=false,saving=false,loading=false;
/* Чи достовірно відомий поточний список фото. Доки false — не чіпаємо
   фото на сервері, щоб не стерти те, чого ми не бачили. */
var photosKnown=false;
function online(){ return /^https?:$/.test(location.protocol); }

/* Знімок стану у форматі, який приймає сервер. */
function snap(){
  var o={};
  TEXTF.forEach(function(k){ if(S[k]) o[k]=S[k]; });
  var on=[]; for(var k in S.chk){ if(S.chk[k]) on.push(k); }
  on.sort();
  var b={sn:S.sn,model:S.model,fields:o,checks:on};
  /* photos надсилаємо ЛИШЕ якщо ми справді знаємо їхній стан.
     Якщо картку відкрито, а фото не завантажились — поле пропускаємо,
     і сервер лишає наявні знімки недоторканими. */
  if(photosKnown) b.photos=S.photos||[];
  return b;
}
/* Стан з рядка localStorage — без чіпання S. */
function snapOf(q,photos){
  var p=new URLSearchParams(q),o={},mdl=p.get('model')||'';
  TEXTF.forEach(function(k){ if(p.get(k)) o[k]=p.get(k); });
  var on=(p.get('c')||'').split(',').filter(Boolean); on.sort();
  return {sn:p.get('sn')||'',model:mdl,fields:o,checks:on,photos:photos||[]};
}
/* Стан з відповіді сервера. */
function snapOfCard(c){
  var o={};
  TEXTF.forEach(function(k){ if(c.fields&&c.fields[k]) o[k]=c.fields[k]; });
  var on=(c.checks||[]).slice(); on.sort();
  return {sn:c.sn||'',model:c.model||'',fields:o,checks:on,photos:c.photos||[]};
}
/* Записати знімок у S. */
function useSnap(n){
  TEXTF.forEach(function(k){ S[k]=n.fields[k]||''; });
  S.model=n.model||''; S.sn=n.sn||S.sn;
  S.chk={}; n.checks.forEach(function(k){ S.chk[k]=true; });
  S.photos=n.photos||[];
}

/* Явне збереження в базу. Повертає проміс, щоб інші дії
   (друк, перехід до реєстру) могли дочекатись запису. */
function sync(){
  if(loading) return Promise.resolve(false);
  if(!S.sn){ toast('Спершу вкажіть серійний номер'); return Promise.resolve(false); }
  if(!online()){ toast('Немає зв’язку — збережено як чернетку'); return Promise.resolve(false); }
  if(saving) return Promise.resolve(false);

  saving=true; refreshSaveBtn();
  /* Фіксуємо картку на момент відправки: доки йде запит,
     користувач міг відсканувати іншу. */
  var body=snap(),sn=body.sn;
  return fetch('/api/cards',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  }).then(function(r){
    if(r.status===401){ toast('Сесія завершилась — увійдіть знову');
      setTimeout(function(){ location.href='/login'; },1200); return false; }
    if(!r.ok) throw 0;
    dropDraft(sn);           /* дані в базі — чернетка зайва */
    unsaved=false;
    toast('Збережено');
    return true;
  }).catch(function(){
    toast('Не вдалося зберегти. Дані лишились на пристрої.');
    return false;
  }).then(function(ok){
    saving=false; refreshSaveBtn();
    return ok;
  });
}

/* Кнопка показує, чи є незбережені зміни. */
function refreshSaveBtn(){
  var b=$('#bSave'); if(!b) return;
  b.disabled=saving||!unsaved;
  b.classList.toggle('pri',unsaved&&!saving);
  b.querySelector('.t').textContent=
    saving?'Збереження…':(unsaved?'Зберегти':'Збережено');
  var st=$('#sstate');
  if(st){
    st.classList.toggle('warn',unsaved&&!saving);
    st.textContent=saving?'Надсилаю до бази…'
      :(unsaved?'Є незбережені зміни'
               :(S.sn?'Усі зміни в базі':'Вкажіть серійний номер'));
  }
}

/* ── порівняння двох знімків ─────────────────────────────────── */
/* Повертає {same, conflicts:[{k,label,a,b}], merged}.
   Розбіжність = обидві сторони мають НЕПОРОЖНЄ і різне значення.
   Якщо одна сторона порожня — беремо непорожню (це доповнення, не конфлікт). */
var FLBL={sn:'S/N',bort:'Бортовий номер',hours:'Наліт',date:'Дата',unit:'Підрозділ',
 holder:'Власник',callsign:'Позивний',post:'Посада',holderPhone:'Телефон власника',
 basis:'Підстава',cost:'Вартість виробу',note:'Примітка',status:'Статус',
 done:'Виконані роботи',doneBy:'Виконав',techPhone:'Телефон техніка',
 act:'Акт',model:'Модель'};

function diff(a,b){
  var conf=[],m={fields:{},checks:[],model:'',sn:a.sn||b.sn};
  ['model'].concat(TEXTF).forEach(function(k){
    var av=(k==='model'?a.model:a.fields[k])||'',
        bv=(k==='model'?b.model:b.fields[k])||'',val;
    if(av&&bv&&av!==bv){ conf.push({k:k,label:FLBL[k]||k,a:av,b:bv}); val=av; }
    else val=av||bv;
    if(k==='model') m.model=val; else if(val) m.fields[k]=val;
  });
  /* Позначки об'єднуються — це доповнення, конфліктом не вважається. */
  var set={};
  a.checks.concat(b.checks).forEach(function(k){ set[k]=true; });
  for(var k in set) m.checks.push(k);
  m.checks.sort();
  /* Фото так само об'єднуються за id — знімок ніколи не «конфліктує». */
  var seen={};
  m.photos=[];
  (a.photos||[]).concat(b.photos||[]).forEach(function(ph){
    if(ph&&ph.id&&!seen[ph.id]){ seen[ph.id]=true; m.photos.push(ph); }
  });
  var onlyA=a.checks.filter(function(k){ return b.checks.indexOf(k)<0; }),
      onlyB=b.checks.filter(function(k){ return a.checks.indexOf(k)<0; });
  /* same лише коли жодна сторона не має того, чого немає в іншої —
     інакше злиття щось додає, і взяти одну сторону означало б втрату. */
  var adds=0;
  ['model'].concat(TEXTF).forEach(function(k){
    var av=(k==='model'?a.model:a.fields[k])||'',
        bv=(k==='model'?b.model:b.fields[k])||'';
    if(av!==bv&&(!av||!bv)) adds++;
  });
  /* Фото теж рахуємо: якщо злиття дає більше, ніж є в будь-якої зі
     сторін, взяти одну сторону означало б втратити знімок. */
  var phSame=m.photos.length===(a.photos||[]).length&&
             m.photos.length===(b.photos||[]).length;
  return {conflicts:conf,merged:m,onlyA:onlyA,onlyB:onlyB,adds:adds,
          same:!conf.length&&!onlyA.length&&!onlyB.length&&!adds&&phSame};
}
function slug(v){
  return String(v||'').trim().toUpperCase().replace(/\s+/g,'-')
    .replace(/[^0-9A-Za-zА-Яа-яЇїІіЄєҐґ'\-]/g,'').replace(/-+/g,'-');
}
function fname(){
  var sur=slug((S.holder||'').trim().split(/\s+/)[0]),
      parts=[slug(modelName(S.model,true)||'БПЛА'),slug(S.unit),sur,'КАРТКА-ПОШКОДЖЕНЬ'];
  if(S.basis) parts.push(slug(S.basis));
  return parts.filter(Boolean).join('_');
}
function markEmpty(){
  [].forEach.call(document.querySelectorAll('#card .field.dt'),function(f){

}

window.addEventListener('beforeprint',applyPrintMode);
window.addEventListener('afterprint',function(){ document.body.className=''; });


function copy(txt){
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(txt).then(function(){ toast('Скопійовано'); },fallback);
  } else fallback();
  function fallback(){
    var t=document.createElement('textarea'); t.value=txt;
    t.style.cssText='position:fixed;opacity:0'; document.body.appendChild(t);
    t.select();
    try{ document.execCommand('copy'); toast('Скопійовано'); }
    catch(e){ prompt('Посилання',txt); }
    document.body.removeChild(t);
  }
}
function dl(blob,name){
  var u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(u); },1000);
}
function cfgBlob(){
  var o={}; TEXTF.concat(['model']).forEach(function(k){ o[k]=S[k]; }); o.chk=S.chk;
  return new Blob([JSON.stringify(o,null,1)],{type:'application/json'});
}
function shareDlg(){

/* ── завантаження картки: сервер + localStorage ──────────────── */
/* Викликається при скануванні / відкритті S/N. Доки не вирішено,
   що робити з розбіжностями, dirty=false і на сервер нічого не йде. */
function loadCard(sn,done){
  dirty=false; loading=true; unsaved=false; photosKnown=false;
  if(S.sn!==sn) S.photos=[];   /* інша картка — чужі фото не переносимо */

  /* Чернетка з цього пристрою — лише для випадку, коли сервера немає.
     База завжди має пріоритет: вона спільна для всіх. */
  var draft=null;
  var dph=draftPhotos(sn);
  try{ var q=localStorage.getItem('dc:'+sn); if(q) draft=snapOf(q,dph); }catch(e){}
  if(draft) draft.sn=sn;

  function finish(){ loading=false; refreshSaveBtn(); done(); }

  if(!online()){
    if(draft){ useSnap(draft); toast('Чернетка з цього пристрою'); unsaved=true; }
    photosKnown=true;            /* фото з чернетки — це весь наш стан */
    dirty=true; finish(); return;
  }

  fetch('/api/cards?sn='+encodeURIComponent(sn)).then(function(r){
    if(r.status===401){ location.href='/login'; throw 'auth'; }
    if(r.status===404) return null;
    if(!r.ok) throw 0;
    return r.json();
  }).then(function(c){
    if(c){
      /* Є в базі — беремо звідти, локальну чернетку відкидаємо:
         вона застаріла й більше не потрібна. */
      useSnap(snapOfCard(c));
      photosKnown=true;          /* сервер віддав повний список фото */
      dropDraft(sn);
      dirty=true; finish(); return;
    }
    /* У базі немає — можливо, картку почали заповнювати офлайн. */
    if(draft){ useSnap(draft); toast('Незбережена чернетка з цього пристрою'); unsaved=true; }
    photosKnown=true;            /* картки в базі немає: стирати нічого */
    dirty=true; finish();
  }).catch(function(e){
    if(e==='auth'){ loading=false; return; }
    if(draft){ useSnap(draft); toast('Сервер недоступний — чернетка з пристрою'); unsaved=true; }
    /* photosKnown лишається false: ми не бачили, що на сервері,
       тож при збереженні не надсилаємо photos і нічого не стираємо. */
    dirty=true; finish();
  });
}

/* Чернетка більше не потрібна, коли дані вже в базі. */
function dropDraft(sn){
  try{ localStorage.removeItem('dc:'+sn); }catch(e){}
  try{ localStorage.removeItem('dcph:'+sn); }catch(e){}
}

/* ── діалог вибору при розбіжностях ──────────────────────────── */
function conflictDlg(d,loc,srv,done){
  var rows=d.conflicts.map(function(c){
    return '<tr><td class="ck">'+esc(c.label)+'</td>'+
      '<td class="cv"><span class="src">Пристрій</span>'+esc(c.a)+'</td>'+
      '<td class="cv"><span class="src">Сервер</span>'+esc(c.b)+'</td></tr>';
  }).join('');
  var extra=(d.onlyA.length||d.onlyB.length)
    ? '<p class="cnote">Позначки пошкоджень (+'+(d.onlyA.length+d.onlyB.length)+
      ') буде об’єднано в будь-якому разі.</p>' : '';

  var ov=document.createElement('div'); ov.className='ov noprint';
  ov.innerHTML='<div class="dlg cdlg"><h3><svg style="width:17px;height:17px">'+
    '<use href="#i-alert"/></svg>Розбіжність даних</h3>'+
    '<p class="cnote">Картка <b class="mono">'+esc(loc.sn)+'</b> відрізняється на цьому '+
    'пристрої та на сервері. Оберіть, що зберегти.</p>'+
    '<div class="ctbl"><table><thead><tr><th></th><th>Цей пристрій</th><th>Сервер</th>'+
    '</tr></thead><tbody>'+rows+'</tbody></table></div>'+extra+
    '<button class="btn pri" data-a="loc">Взяти дані з цього пристрою</button>'+
    '<button class="btn" data-a="srv">Взяти дані з сервера</button></div>';
  document.body.appendChild(ov);

  ov.onclick=function(e){
    var a=e.target.closest('[data-a]'); if(!a) return;
    var pick=a.getAttribute('data-a'),
        base=pick==='loc'?loc:srv,
        other=pick==='loc'?srv:loc,
        m=diff(base,other).merged;   /* base виграє конфлікти, решта — доповнюється */
    useSnap(m);
    document.body.removeChild(ov);
    dirty=true; sync();
    toast(pick==='loc'?'Збережено дані пристрою':'Взято дані з сервера');
    done();
  };
}

/* ── сканер ──────────────────────────────────────────────────── */
var stream=null,det=null,raf=0;
function hasDet(){ return 'BarcodeDetector' in window; }
function mkDet(){ return new window.BarcodeDetector({formats:['qr_code','code_128','code_39','data_matrix']}); }
function parseCode(v){
  v=String(v||'').trim(); var sn=v,mdl='';
  if(/^https?:\/\//i.test(v)){
    try{ var u=new URL(v),q=new URLSearchParams(u.hash.replace(/^#/,'')||u.search);
      sn=q.get('sn')||q.get('s')||u.hash.replace(/^#/,'')||u.pathname.split('/').pop();
      if(q.get('model')) mdl=q.get('model');
    }catch(e){}
  }
  var mm=String(sn).match(/(?:s\/?n)\s*[:=]?\s*([A-Za-z0-9\-]{6,})/i);
  if(mm) sn=mm[1];
  return {sn:String(sn).replace(/[^A-Za-z0-9\-]/g,'').toUpperCase(),model:mdl};
}
function accept(v){
  var t=String(v||'').trim();
  if(t.charAt(0)==='{'){
    try{ var o=JSON.parse(t);
      TEXTF.concat(['model']).forEach(function(k){ if(o[k]!=null) S[k]=o[k]; });
      S.chk={}; (o.c||[]).forEach(function(k){ S.chk[k]=true; });
      stopCam(); S.date=S.date||today(); loadTech();
      dirty=true; save(); render(); return true;
    }catch(e){}
  }
  var r=parseCode(v); if(!r.sn) return false;
  stopCam();
  S.sn=r.sn;
  loadCard(r.sn,function(){
    S.sn=r.sn;
    S.model=S.model||r.model||SN2MODEL[r.sn]||'';
    S.date=S.date||today();
    loadTech(); save(); render();
  });
  return true;
}
var camList=[],camIdx=0,scanCv=null,scanCx=null,lastScan=0;
/* Діагностика сканера — показується кнопкою «Діагностика». */
var DIAG={frames:0,err:'',lum:null,lastText:'',engine:'',camErr:'',res:'',ppm:''};

/* Список доступних камер. Мітки доступні лише після дозволу. */
async function listCams(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.enumerateDevices) return [];
  try{
    var d=await navigator.mediaDevices.enumerateDevices(),
        cams=d.filter(function(x){ return x.kind==='videoinput'; });
    /* Фронтальні камери для сканування наліпок не потрібні. Мітки
       з'являються лише після дозволу; якщо їх немає — лишаємо все. */
    var back=cams.filter(function(c){
      return !/front|фронт|selfie|user|face/i.test(c.label||'');
    });
    return back.length?back:cams;
  }catch(e){ return []; }
}

/* Малює кнопки вибору камери, якщо їх більше однієї. */
/* Коротка зрозуміла назва камери.
   Android: "camera2 0, facing back" -> "Основна"
   iPhone:  "Back Dual Wide Camera"  -> "Ширококутна" */
function camLabel(c,i){
  var l=(c.label||'').toLowerCase();
  if(/ultra|wide-angle|надширок/.test(l)&&/ultra/.test(l)) return 'Ультраширока';
  if(/tele|zoom/.test(l)) return 'Телефото';
  if(/wide/.test(l)) return 'Ширококутна';
  if(/back|rear|environment|facing back/.test(l)) return 'Основна';
  if(!c.label) return 'Камера '+(i+1);
  /* невідома мітка — стискаємо до розумного */
  var t=c.label.replace(/\s*\(.*?\)\s*/g,'').trim();
  return t.length>14?t.slice(0,13)+'…':t;
}

function renderCamPick(){
  var box=$('#campick'); if(!box) return;
  if(camList.length<2){ box.hidden=true; box.innerHTML=''; return; }
  box.hidden=false;

  /* Однакові назви розрізняємо номером. */
  var seen={};
  var names=camList.map(function(c,i){ return camLabel(c,i); });
  names.forEach(function(n){ seen[n]=(seen[n]||0)+1; });
  var used={};
  names=names.map(function(n){
    if(seen[n]<2) return n;
    used[n]=(used[n]||0)+1;
    return n+' '+used[n];
  });

  box.innerHTML=names.map(function(n,i){
    return '<button type="button" class="opt'+(i===camIdx?' on':'')+'" '+
      'data-cam="'+i+'" aria-pressed="'+(i===camIdx)+'">'+esc(n)+'</button>';
  }).join('');

  [].forEach.call(box.querySelectorAll('[data-cam]'),function(b){
    b.onclick=function(){
      var i=+b.getAttribute('data-cam');
      if(i===camIdx) return;
      camIdx=i;
      try{ localStorage.setItem('dc:cam',camList[i].deviceId); }catch(e){}
      renderCamPick();      /* підсвітити обрану ОДРАЗУ, до перезапуску */
      restartCam();
    };
  });
}

/* Лише ideal-обмеження: будь-яке невідоме браузеру поле поза advanced
   змушує Safari відхилити весь запит. focusMode кладемо в advanced —
   там незнані поля ігноруються, а не ламають запит. */
function camConstraints(){
  var v={facingMode:{ideal:'environment'},
         width:{ideal:1280},height:{ideal:720}};
  /* Обрана камера, якщо користувач її вибрав. ideal, а не exact:
     застарілий id має погіршувати вибір, а не ламати запуск. */
  if(camList.length&&camList[camIdx]&&camList[camIdx].deviceId){
    v.deviceId={ideal:camList[camIdx].deviceId};
    delete v.facingMode;
  }
  return {video:v};
}

async function restartCam(){
  stopCam();
  $('#camoff').hidden=true; $('#frame').hidden=false;
  await startStream();
}

async function startStream(){
  stream=null;
  var tries=[camConstraints(),
             {video:{facingMode:{ideal:'environment'}}},
             {video:true}];
  for(var i=0;i<tries.length&&!stream;i++){
    try{ stream=await navigator.mediaDevices.getUserMedia(tries[i]); }
    catch(e){ DIAG.camErr=e.name+' (варіант '+(i+1)+')'; }
  }
  if(!stream){
    $('#frame').hidden=true; $('#camoff').hidden=false;
    $('#camoff').textContent='Немає доступу до камери. Потрібен https або localhost.';
    return false;
  }
  var v=$('#vid');
  v.srcObject=stream;
  v.setAttribute('playsinline','');   /* iOS: не на весь екран */
  v.muted=true;
  try{ await v.play(); }catch(e){}
  applyZoom();
  torchOn=false; refreshTorch();
  scanLoop();
  return true;
}

/* Зум, якщо камера його підтримує (корисно для дрібних QR). */
function camTrack(){ return stream?stream.getVideoTracks()[0]:null; }
function zoomCaps(){
  var t=camTrack();
  if(!t||!t.getCapabilities) return null;
  try{ var c=t.getCapabilities(); return c&&c.zoom?c:null; }catch(e){ return null; }
}
/* Ліхтарик: доступний лише для тилової камери і лише коли потік
   уже запущено. Safari на iOS підтримує з iOS 17. */
var torchOn=false;
function torchCap(){
  var t=camTrack();
  if(!t||!t.getCapabilities) return false;
  try{ var c=t.getCapabilities(); return !!(c&&c.torch); }catch(e){ return false; }
}
function refreshTorch(){
  var btn=$('#bTorch');
  if(!btn) return;
  if(!torchCap()){ btn.hidden=true; torchOn=false; return; }
  btn.hidden=false;
  btn.classList.toggle('on',torchOn);
  btn.setAttribute('aria-pressed',torchOn);
}
async function toggleTorch(){
  var t=camTrack();
  if(!t||!torchCap()) return;
  torchOn=!torchOn;
  try{ await t.applyConstraints({advanced:[{torch:torchOn}]}); }
  catch(e){ torchOn=false; toast('Ліхтарик недоступний'); }
  refreshTorch();
}

var zoomVal=1;
function applyZoom(){
  var c=zoomCaps(),sl=$('#zoom');
  if(!c){ if(sl) sl.parentNode.hidden=true; return; }
  if(sl){
    sl.parentNode.hidden=false;
    sl.min=c.zoom.min; sl.max=c.zoom.max; sl.step=c.zoom.step||0.1;
    if(zoomVal<c.zoom.min||zoomVal>c.zoom.max) zoomVal=c.zoom.min;
    sl.value=zoomVal;
  }
  setZoom(zoomVal);
}
function setZoom(z){
  var t=camTrack(); if(!t||!t.applyConstraints) return;
  zoomVal=z;
  try{ t.applyConstraints({advanced:[{zoom:z}]}); }catch(e){}
}

/* Один прохід розпізнавання: BarcodeDetector, інакше власний декодер. */
async function scanFrame(){
  var v=$('#vid');
  if(!v||!v.videoWidth) return false;

  /* 1. Штатний детектор браузера — найшвидший і найнадійніший
     (саме він працює на Android). */
  if(hasDet()){
    try{
      det=det||mkDet();
      var r=await det.detect(v);
      if(r&&r.length&&r[0].rawValue){
        DIAG.engine='BarcodeDetector';
        DIAG.lastText=r[0].rawValue;
        return accept(r[0].rawValue);
      }
      return false;          /* детектор є — інших рушіїв не потрібно */
    }catch(e){ DIAG.err='BarcodeDetector: '+(e&&e.message||e); }
  }

  /* 2. Запасний шлях для Safari/iOS, де BarcodeDetector відсутній. */
  if(!window.jsQR) return false;
  if(!scanCv){
    scanCv=document.createElement('canvas');
    scanCx=scanCv.getContext('2d');
  }
  var vw=v.videoWidth,vh=v.videoHeight;
  if(!vw||!vh) return false;
  DIAG.frames++;

  var k=Math.min(1,900/Math.max(vw,vh)),
      dw=Math.max(1,Math.round(vw*k)),dh=Math.max(1,Math.round(vh*k));
  if(scanCv.width!==dw||scanCv.height!==dh){ scanCv.width=dw; scanCv.height=dh; }
  try{ scanCx.drawImage(v,0,0,dw,dh); }
  catch(e){ DIAG.err='drawImage: '+e.name; return false; }
  var img;
  try{ img=scanCx.getImageData(0,0,dw,dh); }
  catch(e){ DIAG.err='getImageData: '+e.name; return false; }
  DIAG.lum=frameLum(img); DIAG.res=dw+'x'+dh;

  var jr=null;
  try{ jr=window.jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'}); }
  catch(e){ DIAG.err='jsQR: '+(e&&e.message||e); }
  if(jr&&jr.data){
    DIAG.engine='jsQR'; DIAG.lastText=jr.data;
    return accept(jr.data);
  }
  return false;
}

/* Середня яскравість + розкид: показує, чи кадр реально захоплено. */
function frameLum(img){
  var d=img.data,n=d.length/4,step=Math.max(1,Math.floor(n/2000)),
      sum=0,mn=255,mx=0,cnt=0;
  for(var i=0;i<n;i+=step){
    var g=d[i*4];
    sum+=g; if(g<mn) mn=g; if(g>mx) mx=g; cnt++;
  }
  return {avg:Math.round(sum/cnt),min:mn,max:mx};
}

function scanLoop(){
  var busy=false;
  var tick=async function(){
    if(!stream) return;
    if(!busy){
      busy=true;
      var hit=false;
      try{ hit=await scanFrame(); }catch(e){}
      busy=false;
      if(hit) return;
    }
    raf=requestAnimationFrame(tick);
  };
  raf=requestAnimationFrame(tick);
}

async function startCam(){
  $('#camoff').hidden=true; $('#frame').hidden=false;
  if(!await startStream()) return;
  /* мітки камер стають доступні лише після дозволу */
  camList=await listCams();
  if(camIdx>=camList.length) camIdx=0;   /* список міг змінитись */
  var saved=null; try{ saved=localStorage.getItem('dc:cam'); }catch(e){}
  if(saved){
    var k=camList.findIndex?camList.findIndex(function(c){ return c.deviceId===saved; }):-1;
    if(k>0){ camIdx=k; renderCamPick(); await restartCam(); return; }
  }
  renderCamPick();
}
function stopCam(){
  cancelAnimationFrame(raf); lastScan=0;
  if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream=null; }
  torchOn=false;
  var b=$('#bTorch'); if(b){ b.hidden=true; b.classList.remove('on'); }
  var f=$('#frame'),o=$('#camoff'); if(f) f.hidden=true; if(o) o.hidden=false;
}
async function fromFile(f){
  var bmp=null;
  try{ bmp=await createImageBitmap(f); }catch(e){ toast('Файл не читається'); return; }
  if(hasDet()){
    try{ var r=await (det=det||mkDet()).detect(bmp);
      if(r&&r.length&&accept(r[0].rawValue)) return;
    }catch(e){}
  }
  /* власний декодер: пробуємо кілька масштабів */
  var sizes=[900,600,1400];
  for(var i=0;i<sizes.length;i++){
    var k=Math.min(1,sizes[i]/Math.max(bmp.width,bmp.height)),
        w=Math.round(bmp.width*k),h=Math.round(bmp.height*k);
    var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    var cx=cv.getContext('2d',{willReadFrequently:true});
    cx.drawImage(bmp,0,0,w,h);
    var txt=null;
    try{ txt=QR.decode(cx.getImageData(0,0,w,h)); }catch(e){}
    if(txt&&accept(txt)) return;
  }
  toast('QR не знайдено');
}
function fromJson(f){
  var rd=new FileReader();
  rd.onload=function(){
    try{ var o=JSON.parse(rd.result);
      TEXTF.concat(['model']).forEach(function(k){ if(o[k]!=null) S[k]=o[k]; });
      S.chk=o.chk||{}; S.date=S.date||today(); loadTech();
      photosKnown=true;
      dirty=true; save(); render();
    }catch(e){ toast('Файл не читається'); }
  };
  rd.readAsText(f);
}
function showScan(){
  stopCam(); $('#card').hidden=true; $('#scanBlk').hidden=false;
  $('#loadBlk').hidden=true;
  $('#savebar').hidden=true;
  setTimeout(function(){ var e=$('#sn0'); if(e) e.focus(); },30);
}

$('#bStart').onclick=startCam;
$('#zoom').oninput=function(){ setZoom(+this.value); };
$('#bTorch').onclick=toggleTorch;
$('#bDiag').onclick=function(){
  var v=$('#vid'),t=camTrack(),st=t&&t.getSettings?t.getSettings():{};
  var lines=[
    'BarcodeDetector: '+(hasDet()?'є (нативний)':'немає'),
    'jsQR: '+(window.jsQR?'завантажено':'⚠ НЕ ЗАВАНТАЖЕНО'),
    'Спрацював рушій: '+(DIAG.engine||'—'),
    'Відео: '+(v&&v.videoWidth?v.videoWidth+'x'+v.videoHeight:'немає кадру'),
    'Потік: '+(st.width?st.width+'x'+st.height:'—')+
      (st.frameRate?' @'+Math.round(st.frameRate)+'fps':'')+
      (st.width&&st.width<1280?'  ⚠ НИЗЬКА РОЗДІЛЬНІСТЬ':''),
    'Кадрів оброблено: '+DIAG.frames,
    'Ділянка аналізу: '+(DIAG.res||'—'),
    'Пікселів на модуль: '+(DIAG.ppm||'—'),
    'Яскравість кадру: '+(DIAG.lum?
      ('сер '+DIAG.lum.avg+', від '+DIAG.lum.min+' до '+DIAG.lum.max+
       (DIAG.lum.max-DIAG.lum.min<20?'  ⚠ КАДР ПОРОЖНІЙ':'')):'—'),
    'Останній текст: '+(DIAG.lastText?DIAG.lastText.slice(0,40):'—'),
    'Помилка: '+(DIAG.err||'немає'),
    'Запуск камери: '+(DIAG.camErr||'без помилок'),

  ];
  alert(lines.join('\n'));
};

/* Попередження про незбережені зміни — і при закритті вкладки,
   і при переході в реєстр чи виході. */
window.addEventListener('beforeunload',function(e){
  if(!unsaved||!S.sn) return;
  e.preventDefault(); e.returnValue='';
});

/* Діалог із трьома явними виходами. Системний confirm() давав лише
   два, і «Скасувати» насправді означало «піти без збереження» —
   передумати було неможливо. */
function askUnsaved(what,go){
  var ov=document.createElement('div'); ov.className='ov noprint';
  ov.innerHTML='<div class="dlg"><h3><svg style="width:17px;height:17px">'+
    '<use href="#i-alert"/></svg>Незбережені зміни</h3>'+
    '<p class="cnote">Картку <b class="mono">'+esc(S.sn||'')+'</b> змінено, '+
    'але не збережено в базі. '+esc(what)+'</p>'+
    '<button class="btn pri" data-a="save"><svg><use href="#i-check"/></svg>Зберегти</button>'+
    '<button class="btn" data-a="skip">Не зберігати</button>'+
    '<button class="btn" data-a="stay">Залишитись у картці</button></div>';
  document.body.appendChild(ov);

  function close(){ if(ov.parentNode) document.body.removeChild(ov); }
  ov.onclick=function(e){
    if(e.target===ov){ close(); return; }        /* клік поза діалогом = залишитись */
    var b=e.target.closest('[data-a]'); if(!b) return;
    var a=b.getAttribute('data-a');
    if(a==='stay'){ close(); return; }
    if(a==='skip'){ unsaved=false; close(); go(); return; }
    b.disabled=true; b.querySelector('svg')&&(b.textContent='Збереження…');
    sync().then(function(ok){
      close();
      if(ok) go();
      else toast('Не збережено — зміни лишились на пристрої');
    });
  };
  document.addEventListener('keydown',function esc2(e){
    if(e.key==='Escape'){ close(); document.removeEventListener('keydown',esc2); }
  });
}

[].forEach.call(document.querySelectorAll('header a[href="/list"],header a[href="/logout"]'),

(function init(){
  var q=location.hash.replace(/^#/,'')||location.search.replace(/^\?/,'');
  if(q&&!/=/.test(q)) q='sn='+q;
  if(q){ unpack(q);
    if(S.sn){
      var sn=S.sn,hasData=/[&=]/.test(q)&&q.replace(/^sn=[^&]*&?/,'');
      if(hasData){                      /* повне посилання — це імпорт */
        S.model=S.model||SN2MODEL[sn]||''; S.date=S.date||today(); loadTech();
        dirty=true; save(); render(); return;
      }
      $('#loadBlk').hidden=false;      /* без цього блимав би сканер */
      loadCard(sn,function(){           /* лише S/N — звіряємо з сервером */
        S.sn=sn; S.model=S.model||SN2MODEL[sn]||''; S.date=S.date||today();
        loadTech(); save(); render();
      });
      return; } }
  showScan();
})();
